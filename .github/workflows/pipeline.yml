name: build-deploy-lab

on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: lab-app

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: login acr
        uses: azure/docker-login@v2
        with:
          login-server: ${{ secrets.ACR_LOGIN }}
          username: ${{ secrets.ACR_USER }}
          password: ${{ secrets.ACR_PASS }}

      - name: build image
        run: |
          set -Eeuo pipefail
          TAG=$(echo "$GITHUB_SHA" | head -c7)
          IMAGE="${{ secrets.ACR_LOGIN }}/lab-app:$TAG"

          docker build -t "$IMAGE" .
          docker tag "$IMAGE" "${{ secrets.ACR_LOGIN }}/lab-app:latest"
          docker push "${{ secrets.ACR_LOGIN }}/lab-app" --all-tags

          echo "$IMAGE" > image.txt

      - uses: actions/upload-artifact@v4
        with:
          name: image
          path: image.txt

  deploy:
    needs: build
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: image

      - name: deploy
        run: |
          set -Eeuo pipefail
          IMAGE=$(cat image.txt)

          export ACR_LOGIN_SERVER=$(echo "$IMAGE" | cut -d'/' -f1)
          export IMAGE_NAME=$(echo "$IMAGE" | cut -d'/' -f2 | cut -d':' -f1)
          export IMAGE_TAG=$(echo "$IMAGE" | cut -d':' -f2)

          chmod +x ./deploy.sh
          ./deploy.sh